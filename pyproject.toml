[project]
name = "inknull"
version = "0.1.0"
description = "Null-input controls for ink detection on Herculaneum scroll surfaces"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "zarr>=2.18", "tifffile>=2024.1", "imagecodecs>=2024.1", "pillow>=10"]

[project.optional-dependencies]
v8in = ["torch>=2.4", "safetensors>=0.4", "huggingface_hub>=0.24", "opencv-python-headless>=4.9"]
fetch = ["opencv-python-headless>=4.9"]
test = ["pytest>=8"]

[project.scripts]
inknull = "inknull.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inknull"]
